[project]
name = "pulsewatch"
version = "0.1.0"
description = "Scheduled uptime monitoring with transition-based alerting — FastAPI, Celery and PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nithin C", email = "nithinkcn26@gmail.com" }]
keywords = ["fastapi", "celery", "monitoring", "uptime", "postgresql", "sqlalchemy"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
ignore_missing_imports = true

# Celery's @task decorator is untyped, so strict mode considers every task it
# wraps untyped too. The task bodies themselves are fully annotated and still
# type-checked; only the decorator rule is relaxed.
[[tool.mypy.overrides]]
module = "app.workers.tasks"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Our own deprecation warnings are bugs; third-party ones are noise.
    "error::DeprecationWarning:app.*",
    "ignore::DeprecationWarning:testcontainers.*",
]
